# Sentinel stack. Copy .env.example to .env (repository root) and set the secrets first.
#   docker compose up --build              # mongo, redis, ml, api, web  -> http://localhost:8080
#   docker compose --profile train run --rm ml-train   # train the sample benchmark model inside the ML image
# MongoDB and Redis are not published on the host, so they never collide with local installs.
name: sentinel

services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Durable job queue (BullMQ): imports, scoring and detections survive an API restart.
  # noeviction: BullMQ must never lose queue keys under memory pressure.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  ml:
    build: { context: ., dockerfile: services/ml/Dockerfile }
    environment:
      SENTINEL_ML_TOKEN: ${ML_SERVICE_TOKEN:?set ML_SERVICE_TOKEN in .env}
    volumes: [ml-artifacts:/app/artifacts]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-train:
    profiles: [train]
    build: { context: ., dockerfile: services/ml/Dockerfile }
    volumes: [ml-artifacts:/app/artifacts]
    command: ["sentinel-train", "--config", "configs/cicids-sample.yaml", "--csv", "/app/samples/cicids2017-friday-ddos-sample.csv", "--output-dir", "/app/artifacts"]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGO_URI: mongodb://mongo:27017/sentinel
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: "1"
      ML_SERVICE_URL: http://ml:8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN}
      REDIS_URL: redis://redis:6379
      # Uploads wait here for their import job; a volume, so a retried import still finds its file.
      UPLOAD_DIR: /var/lib/sentinel/uploads
    volumes: [uploads:/var/lib/sentinel/uploads]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      ml: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  mongo-data:
  redis-data:
  uploads:
  ml-artifacts:
