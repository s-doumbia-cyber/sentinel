[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ml"
version = "0.1.0"
description = "Sentinel ML service: training CLI, model registry and inference API (FastAPI)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "numpy>=1.26",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "shap>=0.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sentinel-train = "sentinel_ml.train:main"
sentinel-ml-serve = "sentinel_ml.serve:main"

[tool.setuptools]
packages = ["sentinel_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
