name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # API tests use mongodb-memory-server (downloads a MongoDB binary once per run).
      - run: npm run test
      - run: npm run build
      - name: Dependency audit (non-blocking)
        run: npm audit --omit=dev --audit-level=high || true

  ml:
    name: ML service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ml/pyproject.toml
      - run: pip install -e ".[dev]" pip-audit
      - run: pytest
      - name: Dependency audit (non-blocking)
        run: pip-audit || true

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [node, ml]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          JWT_ACCESS_SECRET: ci-only-not-a-real-secret-0123456789abcdef
          ML_SERVICE_TOKEN: ci-only-internal-token-0123
