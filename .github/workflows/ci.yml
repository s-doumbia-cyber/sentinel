name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Runners are pinned to the image the suite was validated on (run #1, 2026-10-20). `ubuntu-latest`
# moves to Ubuntu 26 from 2026-10-19; Playwright system libraries and the MongoDB test binary
# are distribution-specific, so upgrade deliberately and re-run the e2e job.

# A newer push to the same branch or PR supersedes the running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }} (typecheck, lint, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end of life in April 2026; 22 is the oldest maintained LTS.
        node: [22, 24]
    # Throwaway Redis for the BullMQ integration tests (apps/api/tests/jobs.redis.test.ts).
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SENTINEL_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # API tests run on mongodb-memory-server, which downloads a MongoDB binary on first use.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Blocking: CLAUDE.md §9 requires a dependency audit in CI. Dev-only tooling is excluded.
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  ml:
    name: ML service (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/ml
    env:
      # OpenMP + joblib can busy-spin in containers (CLAUDE.md lesson 12).
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ml/pyproject.toml
      - run: pip install -e ".[dev]" pip-audit
      - run: pytest
      # Informational until the Python dependencies are pinned (the package declares ranges only).
      - name: Dependency audit (report only)
        run: pip-audit || echo "::warning::pip-audit reported issues; see the log above"

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Install Chromium system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: e2e
      # The suite starts its own API on an in-memory MongoDB and its own web server (ports 4310 / 5310).
      - run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [node, ml]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
        env:
          # Placeholders so Compose can interpolate; nothing runs with them.
          JWT_ACCESS_SECRET: ci-only-not-a-real-secret-0123456789abcdef
          ML_SERVICE_TOKEN: ci-only-internal-token-0123
